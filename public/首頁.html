<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動花園監測系統 - 即時監控</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        canvas { 
            width: 100% !important; 
            max-height: 120px; 
            margin-bottom: 10px;
        }
        .box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .box-total { 
            background-color: #0c0a7d !important; 
            border: 1px solid #d1d9e0 !important; 
        }
        .value-display {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>
    
    <header>
        <h1>自動花園監測數值</h1>
        <nav>
            <ul>
                <li><a href="首頁.html">首頁</a></li>
                <li><a href="動機.html">動機</a></li>
                <li><a href="訂閱.html">訂閱</a></li>
                <li><a href="製作名單.html">製作名單</a></li>
                <li><a href="控制中心.html">控制中心</a></li>
            </ul>
        </nav>
    </header> 

    <section class="標題">        
        <h2 id="status">正在建立雲端連線...</h2>
    </section>

    <div class="container">
        <div class="box">
            <span class="label">土壤濕度</span>
            <canvas id="chart-soil"></canvas>
            <div class="value-display">
                <span id="home-moisture">--.-</span>
                <small>%</small>
            </div>
        </div>
    
        <div class="box">
            <span class="label">環境溫度</span>
            <canvas id="chart-temp"></canvas>
            <div class="value-display">
                <span id="home-temp">--.-</span>
                <small>°C</small>
            </div>
        </div>
    
        <div class="box">
            <span class="label">環境濕度</span>
            <canvas id="chart-humi"></canvas>
            <div class="value-display">
                <span id="home-humi">--.-</span>
                <small>%</small>
            </div>
        </div>
    
        <div class="box">
            <span class="label">光照強度</span>
            <canvas id="chart-lux"></canvas>
            <div class="value-display">
                <span id="home-lux">--.-</span>
                <small>lx</small>
            </div>
        </div>

        <div class="box box-total">
            <span class="label">加權結果</span>
            <canvas id="chart-total"></canvas>
            <div class="value-display">
                <span id="home-total">--.-</span>
                <small>Score</small>
            </div>
        </div>
    </div>

    <script>
        // --- 1. MQTT 配置 ---
        const client = mqtt.connect('wss://f17a8164c5cb466da01ab155fdc041cf.s1.eu.hivemq.cloud:8884/mqtt', {
            username: 'ag-4320',
            password: 'Jason5238137'
        });

        const MAX_POINTS = 200; 
        const CHART_STORAGE_KEY = 'garden_chart_data'; // 獨立的 Key，避免與控制中心衝突

        // --- 2. 數據初始化與 LocalStorage 讀取 ---
        let savedHistory = {
            soil: Array(MAX_POINTS).fill(null),
            temp: Array(MAX_POINTS).fill(null),
            humi: Array(MAX_POINTS).fill(null),
            lux: Array(MAX_POINTS).fill(null),
            total: Array(MAX_POINTS).fill(null)
        };

        function loadHistory() {
            try {
                const rawData = localStorage.getItem(CHART_STORAGE_KEY);
                if (rawData) {
                    const parsed = JSON.parse(rawData);
                    // 驗證數據結構是否完整
                    if (parsed && typeof parsed === 'object' && parsed.soil) {
                        savedHistory = parsed;
                        console.log("歷史圖表數據載入成功");
                    }
                }
            } catch (e) {
                console.warn("LocalStorage 載入失敗 (可能是 CSP 限制或資料格式錯誤):", e);
            }
        }
        
        loadHistory();

        // --- 3. 圖表初始化函式 ---
        function initChart(id, label, color, type) {
            const ctx = document.getElementById(id).getContext('2d');
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(MAX_POINTS).fill(''),
                    datasets: [{
                        label: label,
                        data: [...savedHistory[type]], // 複製一份數據
                        borderColor: color,
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        backgroundColor: color + '11',
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 0 },
                    scales: { 
                        x: { display: false }, 
                        y: { 
                            beginAtZero: false, 
                            ticks: { font: { size: 10 }, maxTicksLimit: 5 } 
                        } 
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        const charts = {
            soil: initChart('chart-soil', '土壤', '#4caf50', 'soil'),
            temp: initChart('chart-temp', '溫度', '#ff9800', 'temp'),
            humi: initChart('chart-humi', '濕度', '#2196f3', 'humi'),
            lux: initChart('chart-lux', '光照', '#fbc02d', 'lux'),
            total: initChart('chart-total', '總分', '#90a4ae', 'total')
        };

        // --- 4. 數據更新與儲存邏輯 ---
        function pushData(chart, val, type) {
            if (val === null || val === undefined) return;
            
            const dataset = chart.data.datasets[0].data;
            dataset.push(val);
            if (dataset.length > MAX_POINTS) {
                dataset.shift();
            }
            chart.update('none');

            // 同步回 savedHistory
            savedHistory[type] = dataset;
            
            // 寫入 LocalStorage (加上防呆)
            try {
                localStorage.setItem(CHART_STORAGE_KEY, JSON.stringify(savedHistory));
            } catch (e) {
                if (e.name === 'QuotaExceededError') {
                    console.error("儲存空間已滿，請清理 LocalStorage");
                }
            }
        }

        // --- 5. MQTT 事件處理 ---
        client.on('connect', () => {
            document.getElementById('status').innerText = "雲端連線成功，等待數據中...";
            client.subscribe('esp32/garden/all');
        });

        client.on('message', (topic, payload) => {
            try {
                const res = JSON.parse(payload.toString());
                document.getElementById('status').innerText = "最後更新: " + new Date().toLocaleTimeString();
                
                // 數據配對與更新
                if(res.soil != null) {
                    // 將數值反轉 (100 - 原始數值)，並確保不超出 0~100 的範圍
                    let invertedSoil = 100 - parseFloat(res.soil);
                    invertedSoil = Math.max(0, Math.min(100, invertedSoil));
                    
                    document.getElementById('home-moisture').innerText = invertedSoil.toFixed(1);
                    pushData(charts.soil, invertedSoil, 'soil');
                }
                if(res.t != null) {
                    document.getElementById('home-temp').innerText = res.t;
                    pushData(charts.temp, res.t, 'temp');
                }
                if(res.h != null) {
                    document.getElementById('home-humi').innerText = res.h;
                    pushData(charts.humi, res.h, 'humi');
                }
                if(res.lux != null) {
                    document.getElementById('home-lux').innerText = Math.round(res.lux);
                    pushData(charts.lux, res.lux, 'lux');
                }
                if(res.total != null) {
                    document.getElementById('home-total').innerText = parseFloat(res.total).toFixed(1);
                    pushData(charts.total, res.total, 'total');
                }
            } catch (e) {
                console.error("MQTT 數據解析失敗:", e);
            }
        });

        client.on('error', (err) => {
            document.getElementById('status').innerText = "連線失敗: " + err;
        });

        // 偵測視窗大小改變，自動調整圖表佈局
        window.onresize = () => {
            Object.values(charts).forEach(c => c.resize());
        };
    </script>
</body>
</html>
