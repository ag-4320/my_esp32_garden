<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動花園監測系統 - 即時監控</title>
    <link rel="stylesheet" href="style2.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 確保圖表不會撐破你原本 style2.css 的 box 佈局 */
        canvas { 
            width: 100% !important; 
            max-height: 120px; 
            margin-bottom: 10px;
        }
        .box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* 低調加權格 */
        .box-total { 
            background-color: #f0f4f7 !important; 
            border: 1px solid #d1d9e0 !important; 
        }
    </style>
</head>
<body>
    
    <header>
        <h1>自動花園監測數值</h1>
        <ul>
            <li><a href="首頁.html">首頁</a></li>
            <li><a href="動機.html">動機</a></li>
            <li><a href="訂閱.html">訂閱</a></li>
            <li><a href="製作名單.html">製作名單</a></li>
            <li><a href="控制中心.html">控制中心</a></li>
        </ul>
    </header> 

    <section class="標題">        
        <h2 id="status">系統連線中...</h2>
    </section>

    <div class="container">
        <div class="box">
            <span class="label">土壤濕度趨勢</span>
            <canvas id="chart-soil"></canvas>
            <div class="value-display">
                <span id="home-moisture">--.-</span>
                <small>%</small>
            </div>
        </div>
    
        <div class="box">
            <span class="label">環境溫度趨勢</span>
            <canvas id="chart-temp"></canvas>
            <div class="value-display">
                <span id="home-temp">--.-</span>
                <small>°C</small>
            </div>
        </div>
    
        <div class="box">
            <span class="label">環境濕度趨勢</span>
            <canvas id="chart-humi"></canvas>
            <div class="value-display">
                <span id="home-humi">--.-</span>
                <small>%</small>
            </div>
        </div>
    
        <div class="box">
            <span class="label">光照強度趨勢</span>
            <canvas id="chart-lux"></canvas>
            <div class="value-display">
                <span id="home-lux">--.-</span>
                <small>lx</small>
            </div>
        </div>

        <div class="box box-total">
            <span class="label">加權判定得分</span>
            <canvas id="chart-total"></canvas>
            <div class="value-display">
                <span id="home-total">--.-</span>
                <small>Score</small>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const MAX_POINTS = 500;

        function initChart(id, label, color) {
            const ctx = document.getElementById(id).getContext('2d');
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(MAX_POINTS).fill(''),
                    datasets: [{
                        label: label,
                        data: [],
                        borderColor: color,
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        backgroundColor: color + '11',
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { x: { display: false }, y: { beginAtZero: false } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        const charts = {
            soil: initChart('chart-soil', '土壤', '#4caf50'),
            temp: initChart('chart-temp', '溫度', '#ff9800'),
            humi: initChart('chart-humi', '濕度', '#2196f3'),
            lux: initChart('chart-lux', '光照', '#fbc02d'),
            total: initChart('chart-total', '總分', '#90a4ae')
        };

        function pushData(chart, val) {
            chart.data.datasets[0].data.push(val);
            if (chart.data.datasets[0].data.length > MAX_POINTS) chart.data.datasets[0].data.shift();
            chart.update('none');
        }

        socket.on('mqtt_data', (data) => {
            try {
                const res = JSON.parse(data);
                document.getElementById('status').innerText = "數據更新時間: " + new Date().toLocaleTimeString();
                
                // --- 這裡必須對應 ESP32 的 JSON Key ---
                // 土壤
                if(res.soil !== undefined) { 
                    document.getElementById('home-moisture').innerText = res.soil; 
                    pushData(charts.soil, res.soil); 
                }
                // 溫度 (ESP32 是 res.t)
                if(res.t !== undefined) { 
                    document.getElementById('home-temp').innerText = res.t; 
                    pushData(charts.temp, res.t); 
                }
                // 濕度 (ESP32 是 res.h)
                if(res.h !== undefined) { 
                    document.getElementById('home-humi').innerText = res.h; 
                    pushData(charts.humi, res.h); 
                }
                // 光照
                if(res.lux !== undefined) { 
                    document.getElementById('home-lux').innerText = res.lux; 
                    pushData(charts.lux, res.lux); 
                }
                // 總分
                if(res.total !== undefined) { 
                    document.getElementById('home-total').innerText = parseFloat(res.total).toFixed(1); 
                    pushData(charts.total, res.total); 
                }
            } catch (e) { console.error("解析失敗", e); }
        });
    </script>
</body>
</html>
