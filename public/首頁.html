<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動花園監測系統 - 即時監控</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        canvas { 
            width: 100% !important; 
            max-height: 120px; 
            margin-bottom: 10px;
        }
        .box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .box-total { 
            background-color: #f0f4f7 !important; 
            border: 1px solid #d1d9e0 !important; 
        }
    </style>
</head>
<body>
    
    <header>
        <h1>自動花園監測數值</h1>
        <ul>
            <li><a href="首頁.html">首頁</a></li>
            <li><a href="動機.html">動機</a></li>
            <li><a href="訂閱.html">訂閱</a></li>
            <li><a href="製作名單.html">製作名單</a></li>
            <li><a href="控制中心.html">控制中心</a></li>
        </ul>
    </header> 

    <section class="標題">        
        <h2 id="status">正在建立雲端連線...</h2>
    </section>

    <div class="container">
        <div class="box">
            <span class="label">土壤濕度</span>
            <canvas id="chart-soil"></canvas>
            <div class="value-display">
                <span id="home-moisture">--.-</span>
                <small>%</small>
            </div>
        </div>
    
        <div class="box">
            <span class="label">環境溫度</span>
            <canvas id="chart-temp"></canvas>
            <div class="value-display">
                <span id="home-temp">--.-</span>
                <small>°C</small>
            </div>
        </div>
    
        <div class="box">
            <span class="label">環境濕度</span>
            <canvas id="chart-humi"></canvas>
            <div class="value-display">
                <span id="home-humi">--.-</span>
                <small>%</small>
            </div>
        </div>
    
        <div class="box">
            <span class="label">光照強度</span>
            <canvas id="chart-lux"></canvas>
            <div class="value-display">
                <span id="home-lux">--.-</span>
                <small>lx</small>
            </div>
        </div>

        <div class="box box-total">
            <span class="label">加權結果</span>
            <canvas id="chart-total"></canvas>
            <div class="value-display">
                <span id="home-total">--.-</span>
                <small>Score</small>
            </div>
        </div>
    </div>

    <script>
        // --- MQTT 連線設定 ---
        const client = mqtt.connect('wss://f17a8164c5cb466da01ab155fdc041cf.s1.eu.hivemq.cloud:8884/mqtt', {
            username: 'ag-4320',
            password: 'Jason5238137'
        });

// 1. 將筆數改為 200 (若每 3 秒一筆，可顯示 10 分鐘)
const MAX_POINTS = 200; 

function initChart(id, label, color) {
    const ctx = document.getElementById(id).getContext('2d');
    return new Chart(ctx, {
        type: 'line',
        data: {
            // 橫軸標籤佔位
            labels: Array(MAX_POINTS).fill(''),
            datasets: [{
                label: label,
                // 2. 重要：預填 200 個 null，讓圖表寬度一開始就撐開，不會縮在一起
                data: Array(MAX_POINTS).fill(null), 
                borderColor: color,
                borderWidth: 2,
                pointRadius: 0,
                fill: true,
                backgroundColor: color + '11',
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            // 3. 關閉動畫可以讓高頻率更新時，電腦比較不卡
            animation: { duration: 0 },
            scales: { 
                x: { display: false }, 
                y: { 
                    beginAtZero: false, 
                    ticks: { font: { size: 10 }, maxTicksLimit: 5 } 
                } 
            },
            plugins: { legend: { display: false } }
        }
    });
}

        const charts = {
            soil: initChart('chart-soil', '土壤', '#4caf50'),
            temp: initChart('chart-temp', '溫度', '#ff9800'),
            humi: initChart('chart-humi', '濕度', '#2196f3'),
            lux: initChart('chart-lux', '光照', '#fbc02d'),
            total: initChart('chart-total', '總分', '#90a4ae')
        };

        function pushData(chart, val) {
            if (val === null || val === undefined) return;
            chart.data.datasets[0].data.push(val);
            if (chart.data.datasets[0].data.length > MAX_POINTS) {
                chart.data.datasets[0].data.shift();
            }
            chart.update('none');
        }

        client.on('connect', () => {
            document.getElementById('status').innerText = "雲端連線成功，等待數據中...";
            client.subscribe('esp32/garden/all');
        });

        client.on('message', (topic, payload) => {
            try {
                const res = JSON.parse(payload.toString());
                document.getElementById('status').innerText = "最後更新: " + new Date().toLocaleTimeString();
                
                if(res.soil !== undefined && res.soil !== null) {
                    document.getElementById('home-moisture').innerText = res.soil;
                    pushData(charts.soil, res.soil);
                }
                if(res.t !== undefined && res.t !== null) {
                    document.getElementById('home-temp').innerText = res.t;
                    pushData(charts.temp, res.t);
                }
                if(res.h !== undefined && res.h !== null) {
                    document.getElementById('home-humi').innerText = res.h;
                    pushData(charts.humi, res.h);
                }
                if(res.lux !== undefined && res.lux !== null) {
                    document.getElementById('home-lux').innerText = Math.round(res.lux);
                    pushData(charts.lux, res.lux);
                }
                if(res.total !== undefined && res.total !== null) {
                    document.getElementById('home-total').innerText = parseFloat(res.total).toFixed(1);
                    pushData(charts.total, res.total);
                }
            } catch (e) {
                console.error("JSON 解析錯誤:", e);
            }
        });

        client.on('error', (err) => {
            document.getElementById('status').innerText = "連線失敗: " + err;
        });
    </script>
</body>
</html>
