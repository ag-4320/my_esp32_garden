<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動花園監測系統 - 控制中心</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        .control-area {
            width: 100%;
            height: 160px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
        }

        /* 時間顯示樣式 */
        .time-text {
            font-size: 3.5rem; 
            font-weight: 800;
            color: #007bff;
            text-shadow: 0 0 15px rgba(0, 123, 255, 0.4);
            font-family: 'Courier New', Courier, monospace;
            margin: 10px 0;
        }

        /* 連線標籤與狀態點 */
        .online-tag { font-size: 0.8rem; padding: 2px 8px; border-radius: 12px; margin-left: 8px; }
        .tag-on { background: #e8f5e9; color: #2e7d32; border: 1px solid #2e7d32; }
        .tag-off { background: #ffebee; color: #c62828; border: 1px solid #c62828; }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .dot-online { background-color: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .dot-offline { background-color: #f44336; }

        /* 輸入區域 */
        #input-ui { margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
        input[type="number"] {
            width: 70px; padding: 8px; border: 2px solid #007bff;
            border-radius: 8px; text-align: center; font-size: 1.2rem; font-weight: bold;
        }

        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 1rem; }
        .btn-on { background-color: #4caf50; color: white; }
        .btn-off { background-color: #f44336; color: white; margin-left: 10px; }
        button:disabled { background-color: #ccc !important; cursor: not-allowed; opacity: 0.6; }

        .status-val { font-size: 1.6rem; font-weight: bold; margin-bottom: 10px; }
        .val-on { color: #4caf50; }
        .val-off { color: #f44336; }
    </style>
</head>
<body>
    
    <header>
        <h1>遠端控制設備</h1>
        <ul>
            <li><a href="首頁.html">首頁</a></li>
            <li><a href="動機.html">動機</a></li>
            <li><a href="訂閱.html">訂閱</a></li>
            <li><a href="製作名單.html">製作名單</a></li>
            <li><a href="控制中心.html">控制中心</a></li>
        </ul>
    </header> 

    <section class="標題">        
        <h2 id="status">正在嘗試連線雲端伺服器...</h2>
    </section>

    <div class="container">
        <div class="box">
            <span class="label">現在時間</span>
            <div class="control-area">
                <div id="clock" class="time-text">00:00:00</div>
            </div>
            <div class="value-display">
                <span id="time-status" style="font-size: 1.1rem; font-weight: bold;">時段檢查中...</span>
            </div>
        </div>
    
        <div class="box">
            <span class="label">水閥遠端控制</span>
            <div class="control-area">
                <div id="input-ui">
                    <span style="font-weight: bold; color: #555;">灑水時長:</span>
                    <input type="number" id="duration" value="10" min="1" max="60" 
                           oninput="if(value>60)value=60;if(value<1)value=1"> 
                    <span style="font-weight: bold; color: #555;">秒</span>
                </div>
                <div class="btn-group">
                    <button id="onBtn" onclick="ctl('on')" class="btn-on">執行灑水</button>
                    <button id="offBtn" onclick="ctl('off')" class="btn-off">緊急停止</button>
                </div>
            </div>
            <div class="value-display">
                <span id="action-status">設備已就緒</span>
            </div>
        </div>

        <div class="box">
            <span class="label">水閥即時狀況 <span id="connection-tag" class="online-tag tag-off">離線</span></span>
            <div class="control-area">
                <div id="valve-state" class="status-val val-off">
                    <span id="status-dot" class="dot dot-offline"></span>關閉中
                </div>
                <div style="color: #666; font-size: 0.9rem;">
                    控制來源：<span id="ctrl-by" style="font-weight: bold;">系統自動</span>
                </div>
                <div style="margin-top: 15px; font-weight: bold; border-top: 1px solid #eee; width: 80%; text-align: center; padding-top: 10px;">
                    剩餘秒數：<span id="timer-left" style="font-size: 2rem; color: #007bff;">0</span> 秒
                </div>
            </div>
            <div class="value-display"><span id="live-update">等待數據同步...</span></div>
        </div>
    </div>

    <script>
        const client = mqtt.connect('wss://f17a8164c5cb466da01ab155fdc041cf.s1.eu.hivemq.cloud:8884/mqtt', {
            username: 'ag-4320',
            password: 'Jason5238137'
        });

        let isCoolingDown = false; 

        function updateClock() {
            const now = new Date();
            const h = now.getHours();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-TW', { hour12: false });

            const isAllowed = (h >= 7 && h < 20);
            const onBtn = document.getElementById('onBtn');
            const durationInput = document.getElementById('duration');
            const timeStatus = document.getElementById('time-status');

            if (isAllowed) {
                timeStatus.innerText = "● 接收指令中";
                timeStatus.style.color = "#2e7d32";
                if (!isCoolingDown) {
                    onBtn.disabled = false;
                    durationInput.disabled = false;
                }
            } else {
                timeStatus.innerText = "○ 暫停接收指令";
                timeStatus.style.color = "#c62828";
                onBtn.disabled = true;
                durationInput.disabled = true;
            }
        }

        function ctl(cmd) {
            if (isCoolingDown && cmd === 'on') return;

            if (client.connected) {
                client.publish('esp32/control', cmd);
                const actionStatus = document.getElementById('action-status');
                const valveState = document.getElementById('valve-state');
                const statusDot = document.getElementById('status-dot');
                const ctrlBy = document.getElementById('ctrl-by');
                const timerLeft = document.getElementById('timer-left');

                if (cmd === 'on') {
                    const sec = parseInt(document.getElementById('duration').value);
                    isCoolingDown = true;
                    
                    // 鎖定 UI
                    document.getElementById('onBtn').disabled = true;
                    document.getElementById('duration').disabled = true;
                    
                    // 更新狀態顯示
                    valveState.innerHTML = `<span id="status-dot" class="dot dot-online"></span>開啟中`;
                    valveState.className = "status-val val-on";
                    ctrlBy.innerText = "Mr. Bee (手動)";
                    
                    let countdown = sec;
                    timerLeft.innerText = countdown;

                    const timer = setInterval(() => {
                        countdown--;
                        timerLeft.innerText = countdown;
                        actionStatus.innerText = `執行灑水任務中...`;

                        if (countdown <= 0) {
                            clearInterval(timer);
                            isCoolingDown = false;
                            valveState.innerHTML = `<span id="status-dot" class="dot dot-online"></span>關閉中`;
                            valveState.className = "status-val val-off";
                            ctrlBy.innerText = "系統自動";
                            actionStatus.innerText = "任務已完成";
                            updateClock(); 
                        }
                    }, 1000);
                } else {
                    // 緊急停止
                    client.publish('esp32/control', 'off');
                    alert("緊急停止指令已送出！");
                    location.reload(); 
                }
            } else {
                alert("尚未連線至 MQTT 伺服器");
            }
        }

        client.on('connect', () => {
            document.getElementById('status').innerText = "控制中心：連線成功";
            document.getElementById('live-update').innerText = "數據已同步";
            document.getElementById('connection-tag').innerText = "已連線";
            document.getElementById('connection-tag').className = "online-tag tag-on";
            document.getElementById('status-dot').className = "dot dot-online";
        });

        client.on('close', () => {
            document.getElementById('connection-tag').innerText = "離線";
            document.getElementById('connection-tag').className = "online-tag tag-off";
            document.getElementById('status-dot').className = "dot dot-offline";
        });

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
