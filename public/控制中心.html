<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動花園監測系統 - 控制中心</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* 只針對控制中心特有的元件做微調，其餘全部交給 style2.css */
        
        /* 1. 大時間文字：保留原本的粗體與字體，但顏色與陰影對齊首頁風格 */
        .time-text {
            font-size: 3.5rem; 
            font-weight: 900; 
            color: #0c0a7d; /* 對齊首頁標題的深藍色 */
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 15px 0;
        }

        /* 2. 控制 UI 排版 */
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        
        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: #444;
        }

        input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
            background: rgba(255, 255, 255, 0.5);
        }

        /* 3. 按鈕風格：沿用首頁的圓角邏輯 */
        .btn-group { margin-top: 10px; display: flex; gap: 10px; }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-on { background-color: #4caf50; color: white; }
        .btn-off { background-color: #f44336; color: white; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }
        button:disabled { background-color: #ccc; transform: none; }

        /* 4. 日誌表格：確保不破壞 box 的形狀 */
        .log-box { 
            grid-column: span 2; 
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        th { border-bottom: 2px solid #0c0a7d; padding: 10px; color: #0c0a7d; }
        td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }

        /* 5. 狀態標籤 */
        .status-tag {
            font-weight: 900;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1.1rem;
        }
        .online { color: #2e7d32; }
        .offline { color: #c62828; }
    </style>
</head>
<body>
    
    <header>
        <h1>遠端控制中心</h1>
        <nav>
            <ul>
                <li><a href="首頁.html">首頁</a></li>
                <li><a href="動機.html">動機</a></li>
                <li><a href="訂閱.html">訂閱</a></li>
                <li><a href="製作名單.html">製作名單</a></li>
                <li><a href="控制中心.html" class="active">控制中心</a></li>
            </ul>
        </nav>
    </header> 

    <section class="標題">        
        <h2 id="status" class="status-tag offline">● 等待硬體數據回傳...</h2>
    </section>

    <div class="container">
        
        <div class="box">
            <span class="label">系統計時器</span>
            <div id="clock" class="time-text">00:00:00</div>
            <div id="time-status" style="font-weight: bold; color: #666;">同步時區中...</div>
        </div>
    
        <div class="box">
            <span class="label">人工遠端操作</span>
            <div class="control-group">
                <div class="input-row">
                    <span>操作員</span>
                    <input type="text" id="userName" placeholder="姓名" style="width: 120px;">
                </div>
                <div class="input-row">
                    <span>秒數</span>
                    <input type="number" id="duration" value="10" style="width: 70px;">
                </div>
                <div class="btn-group">
                    <button id="onBtn" onclick="ctl('on')" class="btn-on">執行指令</button>
                    <button id="offBtn" onclick="ctl('off')" class="btn-off">強制終止</button>
                </div>
            </div>
        </div>

        <div class="box">
            <span class="label">水閥即時狀態</span>
            <div id="v-state" style="font-size: 2.5rem; font-weight: 900; color: #0c0a7d;">待命</div>
            <div id="v-source" style="font-size: 0.9rem; color: #888; margin-top: 5px;">控制來源：--</div>
            <div style="font-size: 3rem; color: #007bff; font-weight: 900;"><span id="timer-left">0</span>s</div>
        </div>

        <div class="box log-box">
            <span class="label">歷史操作日誌</span>
            <table>
                <thead>
                    <tr>
                        <th>時間</th>
                        <th>操作者</th>
                        <th>詳情</th>
                        <th>狀態</th>
                    </tr>
                </thead>
                <tbody id="log-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const client = mqtt.connect('wss://f17a8164c5cb466da01ab155fdc041cf.s1.eu.hivemq.cloud:8884/mqtt', {
            username: 'ag-4320', password: 'Jason5238137'
        });

        let lastHeartbeat = 0;
        let historyLogs = [];

        // 監控在線狀態：以是否有收過數據（Heartbeat）為準
        function monitorConnection() {
            const statusEl = document.getElementById('status');
            const now = Date.now();
            if (now - lastHeartbeat > 12000) { // 超過 12 秒沒數據視為離線
                statusEl.innerText = "● 硬體離線 (未接收數據)";
                statusEl.className = "status-tag offline";
            } else {
                statusEl.innerText = "● 硬體在線 (通訊正常)";
                statusEl.className = "status-tag online";
            }
        }

        client.on('connect', () => {
            client.subscribe('esp32/garden/all');
            client.subscribe('esp32/garden/logs');
        });

        client.on('message', (topic, message) => {
            lastHeartbeat = Date.now(); // 只要有訊息進來，就更新在線計時
            
            if (topic === 'esp32/garden/logs') {
                const data = JSON.parse(message.toString());
                historyLogs.unshift(data);
                renderTable();
            }
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-TW', { hour12: false });
            const isOnline = (Date.now() - lastHeartbeat < 12000);
            const h = now.getHours();
            const isWorkingHour = (h >= 7 && h < 20);

            const timeStatusEl = document.getElementById('time-status');
            if (!isOnline) {
                timeStatusEl.innerText = "等待硬體信號...";
            } else {
                timeStatusEl.innerText = isWorkingHour ? "● 系統營運中" : "○ 非營運時間";
                timeStatusEl.style.color = isWorkingHour ? "#2e7d32" : "#c62828";
            }
        }

        function ctl(cmd) {
            const user = document.getElementById('userName').value.trim();
            const sec = document.getElementById('duration').value;
            if (!user && cmd === 'on') { alert("請輸入操作員姓名！"); return; }

            if (client.connected) {
                const logEntry = {
                    time: new Date().toLocaleTimeString(),
                    user: user || "系統",
                    info: cmd === 'on' ? sec + " 秒" : "強制停止",
                    status: cmd === 'on' ? "手動開啟" : "手動關閉",
                    type: cmd === 'on' ? "manual" : "stop"
                };
                client.publish('esp32/control', cmd);
                client.publish('esp32/garden/logs', JSON.stringify(logEntry));
                if(cmd === 'on') {
                    document.getElementById('v-state').innerText = "開啟中";
                    document.getElementById('v-source').innerText = "操作員：" + user;
                } else {
                    location.reload();
                }
            }
        }

        function renderTable() {
            const body = document.getElementById('log-body');
            body.innerHTML = historyLogs.slice(0, 8).map(log => `
                <tr>
                    <td>${log.time}</td>
                    <td>${log.user}</td>
                    <td>${log.info}</td>
                    <td>${log.status}</td>
                </tr>
            `).join('');
        }

        setInterval(updateClock, 1000);
        setInterval(monitorConnection, 3000);
    </script>
</body>
</html>
