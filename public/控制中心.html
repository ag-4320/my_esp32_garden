<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>控制中心</title>
    <link rel="stylesheet" href="style2.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <header>
        <h1>遠端控制設備</h1>
        <ul><li><a href="首頁.html">回首頁</a></li></ul>
    </header>

    <div class="container">
        <div class="box">
            <h3>手動水閥開關</h3>
            <button onclick="ctl('on')" style="background: green; color: white; padding: 15px;">強制開啟</button>
            <button onclick="ctl('off')" style="background: red; color: white; padding: 15px;">關閉水閥</button>
        </div>
    </div>

    <script>
        const socket = io();
        function ctl(cmd) {
            socket.emit('control_valve', cmd); // 修改處：將指令傳給 index.js
            alert("指令已下達: " + cmd);
        }
    </script>
</body>
</html>
