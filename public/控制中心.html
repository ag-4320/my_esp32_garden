<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動花園監測系統 - 控制中心</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* --- 內部組件微調：維持原本格子形式，僅針對零件排版 --- */
        .time-text {
            font-size: 3.5rem; 
            font-weight: 800;
            color: #007bff;
            text-shadow: 0 0 15px rgba(0, 123, 255, 0.4);
            font-family: 'Courier New', Courier, monospace;
            margin: 10px 0;
        }

        #input-ui { margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .input-row { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        
        input[type="text"], input[type="number"] {
            padding: 8px; border: 2px solid #007bff; border-radius: 8px; text-align: center; font-weight: bold;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-on { background-color: #4caf50; color: white; }
        .btn-off { background-color: #f44336; color: white; }
        button:disabled { background-color: #ccc !important; opacity: 0.6; }

        /* 表格格子專用樣式 (強制依照原本 log-box 形式) */
        .log-box { grid-column: span 2; width: 100%; justify-content: flex-start; padding-top: 50px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; }
        th { background-color: #007bff; color: white; }
        
        .badge { padding: 3px 8px; border-radius: 5px; color: white; font-size: 0.8rem; font-weight: bold; }
        .bg-manual { background: #4caf50; }
        .bg-stop { background: #f44336; }
        
        .page-ctrl { margin-top: 15px; display: flex; gap: 15px; align-items: center; }
        .status-tag { font-weight: 900; }
        .online { color: #2e7d32; }
        .offline { color: #c62828; }
    </style>
</head>
<body>
    
    <header>
        <h1>遠端控制中心</h1>
        <nav>
            <ul>
                <li><a href="首頁.html">首頁</a></li>
                <li><a href="動機.html">動機</a></li>
                <li><a href="訂閱.html">訂閱</a></li>
                <li><a href="製作名單.html">製作名單</a></li>
                <li><a href="控制中心.html">控制中心</a></li>
            </ul>
        </nav>
    </header> 

    <section class="標題">        
        <h2 id="status" class="status-tag offline">● 離線</h2>
    </section>

    <div class="container">
        <div class="box">
            <span class="label">現在時間</span>
            <div id="clock" class="time-text">00:00:00</div>
            <div class="value-display">
                <span id="time-status" style="font-weight: bold;">檢查中...</span>
            </div>
        </div>
    
        <div class="box">
            <span class="label">水閥控制開關</span>
            <div id="input-ui">
                <div class="input-row">
                    <span>操作員:</span>
                    <input type="text" id="userName" placeholder="姓名" maxlength="10" style="width: 120px;">
                </div>
                <div class="input-row">
                    <span>開啟:</span>
                    <input type="number" id="duration" value="10" min="1" max="60" style="width: 80px;"> 秒
                </div>
            </div>
            <div class="btn-group">
                <button id="onBtn" onclick="ctl('on')" class="btn-on">強制開啟</button>
                <button id="offBtn" onclick="ctl('off')" class="btn-off">緊急關閉</button>
            </div>
            <div id="action-status" style="margin-top: 10px; font-size: 0.9rem; color: #666;">準備就緒</div>
        </div>

        <div class="box">
            <span class="label">水閥即時狀況</span>
            <div id="v-state" style="font-size: 2.5rem; font-weight: 900; color: #f44336;">關閉中</div>
            <div id="v-source" style="font-size: 0.9rem; color: #888; margin-top: 5px;">控制來源：系統自動</div>
            <div style="font-size: 3rem; color: #007bff; font-weight: 800; margin-top: 10px;"><span id="timer-left">0</span>s</div>
        </div>

        <div class="box log-box">
            <span class="label">歷史操作日誌</span>
            <table>
                <thead>
                    <tr>
                        <th>執行時間</th>
                        <th>操作者</th>
                        <th>詳情</th>
                        <th>最終狀態</th>
                    </tr>
                </thead>
                <tbody id="log-body"></tbody>
            </table>
            <div class="page-ctrl">
                <button onclick="changePage(-1)">上一頁</button>
                <span id="page-info" style="font-weight: bold;">第 1 頁</span>
                <button onclick="changePage(1)">下一頁</button>
            </div>
        </div>
    </div>

    <script>
        const client = mqtt.connect('wss://f17a8164c5cb466da01ab155fdc041cf.s1.eu.hivemq.cloud:8884/mqtt', {
            username: 'ag-4320', password: 'Jason5238137'
        });

        let historyLogs = []; 
        let currentPage = 1;
        let lastDataTime = 0;
        let isCoolingDown = false;

        client.on('connect', () => {
            client.subscribe('esp32/garden/logs');
            client.subscribe('esp32/garden/all');
        });

        client.on('message', (topic, message) => {
            lastDataTime = Date.now();
            if (topic === 'esp32/garden/logs') {
                const data = JSON.parse(message.toString());
                historyLogs.unshift(data);
                if (historyLogs.length > 50) historyLogs.pop();
                renderTable();
            }
        });

        function updateClock() {
            const now = new Date();
            const h = now.getHours();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-TW', { hour12: false });

            const isOnline = (Date.now() - lastDataTime < 12000);
            const isAllowed = (h >= 7 && h < 20);
            
            const statusTag = document.getElementById('status');
            const onBtn = document.getElementById('onBtn');
            const timeStatus = document.getElementById('time-status');

            if (!isOnline) {
                statusTag.innerText = "● 硬體離線 (未接收到數據)";
                statusTag.className = "status-tag offline";
                timeStatus.innerText = "● 硬體離線";
                timeStatus.style.color = "#888";
                onBtn.disabled = true;
            } else {
                statusTag.innerText = "● 硬體在線 (數據傳輸正常)";
                statusTag.className = "status-tag online";
                if (!isCoolingDown) {
                    onBtn.disabled = !isAllowed;
                    timeStatus.innerText = isAllowed ? "● 系統營運中" : "○ 非操作時段";
                    timeStatus.style.color = isAllowed ? "#2e7d32" : "#c62828";
                }
            }
        }

        function ctl(cmd) {
            const user = document.getElementById('userName').value.trim();
            const sec = document.getElementById('duration').value;

            if (!user && cmd === 'on') { alert("請輸入操作員姓名！"); return; }

            if (client.connected) {
                const nowTime = new Date().toLocaleTimeString();
                let logEntry = {
                    time: nowTime, user: user || "系統",
                    info: cmd === 'on' ? sec + " 秒" : "強制停機",
                    status: cmd === 'on' ? "手動開啟" : "手動停止",
                    type: cmd === 'on' ? "manual" : "stop"
                };

                client.publish('esp32/control', cmd);
                client.publish('esp32/garden/logs', JSON.stringify(logEntry));

                if (cmd === 'on') {
                    isCoolingDown = true;
                    document.getElementById('onBtn').disabled = true;
                    document.getElementById('v-state').innerText = "開啟中";
                    document.getElementById('v-state').style.color = "#4caf50";
                    document.getElementById('v-source').innerText = "控制來源：" + user;
                    
                    let count = sec;
                    document.getElementById('timer-left').innerText = count;
                    const timer = setInterval(() => {
                        count--;
                        document.getElementById('timer-left').innerText = count;
                        if (count <= 0) {
                            clearInterval(timer);
                            isCoolingDown = false;
                            document.getElementById('v-state').innerText = "關閉中";
                            document.getElementById('v-state').style.color = "#f44336";
                            document.getElementById('v-source').innerText = "控制來源：系統自動";
                            updateClock();
                        }
                    }, 1000);
                } else {
                    location.reload(); 
                }
            }
        }

        function renderTable() {
            const start = (currentPage - 1) * 10;
            const displayData = historyLogs.slice(start, start + 10);
            const body = document.getElementById('log-body');
            body.innerHTML = displayData.map(log => `
                <tr>
                    <td>${log.time}</td>
                    <td>${log.user}</td>
                    <td>${log.info}</td>
                    <td><span class="badge bg-${log.type}">${log.status}</span></td>
                </tr>
            `).join('');
            document.getElementById('page-info').innerText = `第 ${currentPage} 頁`;
        }

        function changePage(dir) {
            const maxPage = Math.ceil(historyLogs.length / 10) || 1;
            currentPage += dir;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > maxPage) currentPage = maxPage;
            renderTable();
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
