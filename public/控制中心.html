<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動花園監測系統 - 控制中心</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* --- 基礎佈局與首頁風格對齊 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #f4f7f9; font-family: "Microsoft JhengHei", sans-serif; padding-bottom: 50px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        header h1 { font-size: 1.5rem; color: #0c0a7d; font-weight: 900; }
        header ul { display: flex; list-style: none; gap: 20px; }
        header ul li a { text-decoration: none; color: #555; font-weight: bold; transition: 0.3s; }
        header ul li a:hover { color: #007bff; }
        header ul li a.active { color: #007bff; border-bottom: 2px solid #007bff; }

        /* --- 內容佈局 --- */
        .標題 { text-align: center; padding: 40px 20px 20px 20px; }
        #status { font-size: 1.1rem; color: #64748b; font-weight: bold; }

        .container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .box { 
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px); 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 280px; 
            padding: 25px;
            position: relative;
        }

        .label { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            font-weight: 900; 
            color: #444; 
            font-size: 0.9rem; 
            border-left: 5px solid #007bff; 
            padding-left: 10px;
        }

        .time-text {
            font-size: 3.5rem; 
            font-weight: 800; 
            color: #007bff;
            text-shadow: 0 0 15px rgba(0, 123, 255, 0.3);
            font-family: 'Courier New', Courier, monospace;
        }

        /* 狀態標籤顏色 */
        .online-tag { color: #2e7d32; }
        .offline-tag { color: #c62828; }

        /* 控制組件 */
        #input-ui { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .input-row { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        input { padding: 8px; border: 2px solid #007bff; border-radius: 8px; text-align: center; }

        .btn-group { margin-top: 10px; }
        button { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-on { background-color: #4caf50; color: white; }
        .btn-off { background-color: #f44336; color: white; margin-left: 10px; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        /* 表格樣式 */
        .log-box { grid-column: span 2; width: 100%; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; background: white; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; }
        th { background-color: #007bff; color: white; }
        .badge { padding: 3px 8px; border-radius: 5px; color: white; font-size: 0.8rem; font-weight: bold; }
        .bg-manual { background: #4caf50; }
        .bg-stop { background: #f44336; }
    </style>
</head>
<body>
    
    <header>
        <h1>遠端控制中心</h1>
        <nav>
            <ul>
                <li><a href="首頁.html">首頁</a></li>
                <li><a href="動機.html">動機</a></li>
                <li><a href="訂閱.html">訂閱</a></li>
                <li><a href="製作名單.html">製作名單</a></li>
                <li><a href="控制中心.html" class="active">控制中心</a></li>
            </ul>
        </nav>
    </header> 

    <section class="標題">        
        <h2 id="status" class="offline-tag">硬體離線中 (等待數據傳輸...)</h2>
    </section>

    <div class="container">
        <div class="box">
            <span class="label">系統計時器</span>
            <div id="clock" class="time-text">00:00:00</div>
            <div style="margin-top: 15px;"><span id="time-status" style="font-weight: bold;">檢查系統時區...</span></div>
        </div>
    
        <div class="box">
            <span class="label">人工遠端操作</span>
            <div id="input-ui">
                <div class="input-row"><span>操作員:</span><input type="text" id="userName" placeholder="請輸入姓名"></div>
                <div class="input-row"><span>時長:</span><input type="number" id="duration" value="10"> 秒</div>
            </div>
            <div class="btn-group">
                <button id="onBtn" onclick="ctl('on')" class="btn-on">執行指令</button>
                <button id="offBtn" onclick="ctl('off')" class="btn-off">強制終止</button>
            </div>
        </div>

        <div class="box">
            <span class="label">水閥即時回傳</span>
            <div id="v-state" style="font-size: 2rem; font-weight: 900; color: #94a3b8;">等待心跳信號</div>
            <div id="v-source" style="font-size: 0.9rem; color: #888; margin-top: 5px;">控制來源：--</div>
            <div style="font-size: 2.5rem; color: #007bff; font-weight: 800; margin-top: 10px;"><span id="timer-left">0</span>s</div>
        </div>

        <div class="box log-box">
            <span class="label">操作日誌回溯</span>
            <table>
                <thead><tr><th>執行時間</th><th>操作者</th><th>詳情</th><th>最終狀態</th></tr></thead>
                <tbody id="log-body"></tbody>
            </table>
        </div>
    </div>

    <script>

            username: 'ag-4320', password: 'Jason5238137'
        });

            const now = Date.now();

                statusEl.innerText = "● 硬體已離線 (無數據傳輸)";
                statusEl.className = "offline-tag";
                document.getElementById('v-state').innerText = "連線超時";
                document.getElementById('v-state').style.color = "#94a3b8";
            } else {
                statusEl.innerText = "● 硬體在線 (數據傳輸正常)";
                statusEl.className = "online-tag";

                updateClock(); // 順便更新狀態文字
            }
        });
