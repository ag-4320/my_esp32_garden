<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動花園監測系統 - 控制中心</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* --- 針對格子內零件的微調 (不影響外框) --- */
        .time-text {
            font-size: 3.5rem; 
            font-weight: 800;
            color: #007bff;
            text-shadow: 0 0 15px rgba(0, 123, 255, 0.4);
            font-family: 'Courier New', Courier, monospace;
            margin: 10px 0;
        }

        #input-ui {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="number"] {
            width: 80px;
            padding: 8px;
            border: 2px solid #007bff;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .btn-group { display: flex; gap: 10px; }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-on { background-color: #4caf50; color: white; }
        .btn-off { background-color: #f44336; color: white; }
        button:disabled { background-color: #ccc !important; opacity: 0.6; }

        .lock-msg { color: #f44336; font-size: 0.9rem; font-weight: bold; margin-top: 10px; }
        .status-tag { font-weight: 900; }
        .online { color: #2e7d32; }
        .offline { color: #c62828; }
    </style>
</head>
<body>
    
    <header>
        <h1>遠端控制中心</h1>
        <nav>
            <ul>
                <li><a href="首頁.html">首頁</a></li>
                <li><a href="動機.html">動機</a></li>
                <li><a href="訂閱.html">訂閱</a></li>
                <li><a href="製作名單.html">製作名單</a></li>
                <li><a href="控制中心.html" style="color: #007bff; border-bottom: 2px solid #007bff;">控制中心</a></li>
            </ul>
        </nav>
    </header> 

    <section class="標題">        
        <h2 id="status" class="status-tag offline">● 等待硬體數據回傳...</h2>
    </section>

    <div class="container">
        <div class="box">
            <span class="label">現在時間</span>
            <div id="clock" class="time-text">00:00:00</div>
            <div class="value-display">
                <span id="time-status" style="font-size: 1.1rem; font-weight: bold;">檢查中...</span>
            </div>
        </div>
    
        <div class="box">
            <span class="label">水閥控制開關</span>
            <div id="input-ui">
                <span style="font-weight: bold; color: #555;">預計開啟:</span>
                <input type="number" id="duration" value="10" min="0" max="60" 
                       oninput="if(value>60)value=60;if(value<0)value=0"> 
                <span style="font-weight: bold; color: #555;">秒</span>
            </div>
            
            <div class="btn-group">
                <button id="onBtn" onclick="ctl('on')" class="btn-on">強制開啟</button>
                <button id="offBtn" onclick="ctl('off')" class="btn-off">緊急關閉</button>
            </div>
            <div id="lockMsg" class="lock-msg" style="display:none;">⚠️ 非控制時段 (07-20)</div>
            <div class="value-display" style="margin-top: 10px;">
                <span id="action-status">準備就緒</span>
            </div>
        </div>
    </div>

    <script>
        const client = mqtt.connect('wss://f17a8164c5cb466da01ab155fdc041cf.s1.eu.hivemq.cloud:8884/mqtt', {
            username: 'ag-4320', password: 'Jason5238137'
        });

        let lastDataTime = 0;
        let isCoolingDown = false;

        // 判斷在線標準：有沒有收到資料
        function checkConnection() {
            const statusEl = document.getElementById('status');
            const now = Date.now();
            if (now - lastDataTime > 12000) {
                statusEl.innerText = "● 硬體離線 (未接收到資料)";
                statusEl.className = "status-tag offline";
            } else {
                statusEl.innerText = "● 硬體在線 (數據傳輸中)";
                statusEl.className = "status-tag online";
            }
        }

        client.on('connect', () => {
            client.subscribe('esp32/garden/all'); // 訂閱數據流
        });

        client.on('message', (topic, message) => {
            lastDataTime = Date.now(); // 只要有訊息進來就更新
        });

        function updateClock() {
            const now = new Date();
            const h = now.getHours();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-TW', { hour12: false });

            const isOnline = (Date.now() - lastDataTime < 12000);
            const isAllowed = (h >= 7 && h < 20);
            
            const onBtn = document.getElementById('onBtn');
            const timeStatus = document.getElementById('time-status');
            const lockMsg = document.getElementById('lockMsg');

            if (!isOnline) {
                timeStatus.innerText = "等待數據回傳...";
                timeStatus.style.color = "#888";
            } else if (isAllowed) {
                timeStatus.innerText = "● 接收指令中";
                timeStatus.style.color = "#2e7d32";
                lockMsg.style.display = "none";
                if (!isCoolingDown) onBtn.disabled = false;
            } else {
                timeStatus.innerText = "○ 暫停接收指令";
                timeStatus.style.color = "#c62828";
                lockMsg.style.display = "block";
                onBtn.disabled = true;
            }
        }

        function ctl(cmd) {
            if (isCoolingDown && cmd === 'on') return;

            if (client.connected) {
                client.publish('esp32/control', cmd);
                const actionStatus = document.getElementById('action-status');
                actionStatus.innerText = cmd === 'on' ? "指令已發送" : "已要求關閉";

                if (cmd === 'on') {
                    isCoolingDown = true;
                    document.getElementById('onBtn').disabled = true;
                    let countdown = 5;
                    const timer = setInterval(() => {
                        actionStatus.innerText = `冷卻中 (${countdown}s)`;
                        countdown--;
                        if (countdown < 0) {
                            clearInterval(timer);
                            isCoolingDown = false;
                            actionStatus.innerText = "準備就緒";
                            updateClock();
                        }
                    }, 1000);
                }
            } else {
                alert("尚未連線至伺服器");
            }
        }

        setInterval(updateClock, 1000);
        setInterval(checkConnection, 3000);
    </script>
</body>
</html>
