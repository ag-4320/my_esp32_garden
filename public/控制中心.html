<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動花園監測系統 - 遠端控制中心</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* --- 頁面質感與背景融合 --- */
        body { color: #fff; font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; }

        .time-text {
            font-size: 3.5rem; 
            font-weight: 800;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            font-family: 'Courier New', Courier, monospace;
            margin: 10px 0;
        }

        /* --- 按鈕視覺升級 (精品控制感) --- */
        .btn-group { display: flex; gap: 20px; margin-top: 15px; width: 100%; justify-content: center; }
        
        button { 
            padding: 12px 30px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 900; 
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.2s ease; 
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
        }

        .btn-on { 
            background: linear-gradient(145deg, #43a047, #2e7d32);
            color: white; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-on:hover:not(:disabled) { 
            background: linear-gradient(145deg, #4caf50, #388e3c);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.6), 0 4px 0 rgba(0,0,0,0.2);
            transform: translateY(-2px);
        }

        .btn-off { 
            background: linear-gradient(145deg, #d32f2f, #b71c1c);
            color: white; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-off:hover:not(:disabled) { 
            background: linear-gradient(145deg, #f44336, #d32f2f);
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.6), 0 4px 0 rgba(0,0,0,0.2);
            transform: translateY(-2px);
        }

        button:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        button:disabled { 
            background: #444 !important; 
            color: #888; 
            cursor: not-allowed; 
            box-shadow: none; 
            transform: none;
        }

        /* --- 輸入框視覺優化 (新增) --- */
        .input-row {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #00d4ff;
            font-weight: bold;
        }

        input[type="text"], input[type="number"] {
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(0, 212, 255, 0.4); 
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-family: 'Consolas', 'Courier New', monospace;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
        }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* --- 表格與日誌優化 --- */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px; 
            background: rgba(0, 0, 0, 0.25); 
            backdrop-filter: blur(8px);
            border-radius: 15px;
            overflow: hidden; 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        th { 
            background-color: rgba(12, 10, 125, 0.6); 
            color: #00d4ff; 
            padding: 15px;
            border-bottom: 2px solid rgba(0, 212, 255, 0.2);
        }

        td { border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 12px; color: #eee; }

        .badge { padding: 5px 12px; border-radius: 20px; color: white; font-size: 0.8rem; font-weight: bold; }
        .bg-manual { background: #2e7d32; box-shadow: 0 0 10px rgba(46, 125, 50, 0.5); }
        .bg-stop { background: #c62828; box-shadow: 0 0 10px rgba(198, 40, 40, 0.5); }
    </style>
</head>
<body>
    
    <header>
        <h1>遠端控制中心</h1>
        <nav>
            <ul>
                <li><a href="首頁.html">首頁</a></li>
                <li><a href="動機.html">動機</a></li>
                <li><a href="訂閱.html">訂閱</a></li>
                <li><a href="製作名單.html">製作名單</a></li>
                <li><a href="控制中心.html" class="active">控制中心</a></li>
            </ul>
        </nav>
    </header> 

    <section class="標題">        
        <h2 id="status" class="status-tag offline">● 連線狀態檢查中...</h2>
    </section>

    <div class="container">
        <div class="box">
            <span class="label">系統即時時間</span>
            <div id="clock" class="time-text">00:00:00</div>
            <div class="value-display">
                <span id="time-status" style="font-weight: bold; color: #00ff88;">● 系統狀態檢查中</span>
            </div>
        </div>
    
        <div class="box">
            <span class="label">手動介入開關</span>
            <div id="input-ui">
                <div class="input-row">
                    <span>操作員:</span>
                    <input type="text" id="userName" placeholder="請輸入姓名" maxlength="10" style="width: 130px;">
                </div>
                <div class="input-row">
                    <span>持續時間:</span>
                    <input type="number" id="duration" value="10" min="1" max="60" style="width: 80px;"> 秒
                </div>
            </div>
            <div class="btn-group">
                <button id="onBtn" onclick="ctl('on')" class="btn-on" disabled>強制開啟水閥</button>
                <button id="offBtn" onclick="ctl('off')" class="btn-off">緊急停止系統</button>
            </div>
            <div id="action-status" style="margin-top: 12px; font-size: 0.95rem; color: #00d4ff; font-weight: bold;">系統待命</div>
        </div>

        <div class="box">
            <span class="label">硬體即時狀態回傳</span>
            <div id="v-state" style="font-size: 2.8rem; font-weight: 900; color: #ff4d4d; transition: 0.5s;">關閉中</div>
            <div id="v-source" style="font-size: 0.9rem; color: #aaa; margin-top: 5px;">目前來源：自動監測模式</div>
            <div style="font-size: 3rem; color: #00d4ff; font-weight: 800; margin-top: 10px;"><span id="timer-left">0</span>s</div>
        </div>

        <div class="box log-box">
            <span class="label">歷史操作紀錄</span>
            <table>
                <thead>
                    <tr>
                        <th>執行時間</th>
                        <th>操作員</th>
                        <th>詳情</th>
                        <th>狀態</th>
                    </tr>
                </thead>
                <tbody id="log-body"></tbody>
            </table>
            <div class="page-ctrl">
                <button onclick="changePage(-1)">上一頁</button>
                <span id="page-info">第 1 / 1 頁</span>
                <button onclick="changePage(1)">下一頁</button>
            </div>
        </div>
    </div>

    <script>
        const client = mqtt.connect('wss://f17a8164c5cb466da01ab155fdc041cf.s1.eu.hivemq.cloud:8884/mqtt', {
            username: 'ag-4320', 
            password: 'Jason5238137'
        });

        // 營運時段設定
        const START_HOUR = 7;
        const END_HOUR = 21;

        let historyLogs = []; 
        let currentPage = 1;
        let lastDataTime = 0;
        let isOperating = false;
        let countdownTimer = null; 

        window.onload = () => {
            const saved = localStorage.getItem('garden_history');
            if(saved) historyLogs = JSON.parse(saved);
            renderTable();
        };

        client.on('connect', () => {
            client.subscribe('esp32/garden/all'); 
        });

        client.on('message', (topic, message) => {
            if (topic === 'esp32/garden/all') {
                lastDataTime = Date.now();
                try {
                    const data = JSON.parse(message.toString());
                    const vState = document.getElementById('v-state');
                    if (data.v === 1) {
                        vState.innerText = "開啟中";
                        vState.style.color = "#00ff88";
                        vState.style.textShadow = "0 0 15px rgba(0, 255, 136, 0.5)";
                    } else if (!isOperating) {
                        vState.innerText = "關閉中";
                        vState.style.color = "#ff4d4d";
                        vState.style.textShadow = "none";
                    }
                } catch(e) {}
            }
        });

        function updateClock() {
            const now = new Date();
            const currentHour = now.getHours();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-TW', { hour12: false });
            
            const isOnline = (Date.now() - lastDataTime < 15000); 
            const statusTag = document.getElementById('status');
            const onBtn = document.getElementById('onBtn');
            const timeStatus = document.getElementById('time-status');

            // --- 新增：時段鎖定判斷 ---
            const isInTime = (currentHour >= START_HOUR && currentHour < END_HOUR);

            if (!isInTime) {
                timeStatus.innerText = "● 非營運時段 (07:00-21:00)";
                timeStatus.style.color = "#ffae00"; 
                onBtn.disabled = true;
                onBtn.innerText = "非開放時段";
            } else {
                timeStatus.innerText = "● 系統營運中";
                timeStatus.style.color = "#00ff88";
                onBtn.innerText = "強制開啟水閥";
                
                // 只有在線且不在運作中時才啟用
                if (isOnline && !isOperating) {
                    onBtn.disabled = false;
                } else {
                    onBtn.disabled = true;
                }
            }

            if (!isOnline) {
                statusTag.innerText = "● 硬體通訊離線";
                statusTag.style.color = "#ff4d4d";
            } else {
                statusTag.innerText = "● 硬體通訊正常";
                statusTag.style.color = "#00ff88";
            }
        }

        function ctl(cmd) {
            const user = document.getElementById('userName').value.trim();
            const sec = parseInt(document.getElementById('duration').value) || 10;
            if (cmd === 'on' && !user) { alert("請輸入操作員姓名以便記錄！"); return; }
            
            if (client.connected) {
                const nowTime = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                const payload = (cmd === 'on') ? `on:${sec}` : "off";
                
                addLog({ 
                    time: nowTime, 
                    user: user || "系統", 
                    info: cmd === 'on' ? sec + " 秒" : "手動強制停機", 
                    status: cmd === 'on' ? "手動開啟" : "手動停止", 
                    type: cmd === 'on' ? "manual" : "stop" 
                });

                client.publish('esp32/control', payload, { qos: 1 });
                
                if (cmd === 'on') {
                    isOperating = true;
                    document.getElementById('onBtn').disabled = true;
                    document.getElementById('v-state').innerText = "開啟中";
                    document.getElementById('v-state').style.color = "#00ff88";
                    document.getElementById('v-source').innerText = "控制來源：" + user;
                    document.getElementById('action-status').innerText = "指令已下達 - 運作中";
                    
                    let count = sec;
                    document.getElementById('timer-left').innerText = count;
                    if(countdownTimer) clearInterval(countdownTimer); 
                    countdownTimer = setInterval(() => {
                        count--;
                        document.getElementById('timer-left').innerText = Math.max(count, 0);
                        if (count <= 0) stopWatering();
                    }, 1000);
                } else {
                    stopWatering();
                    document.getElementById('action-status').innerText = "系統已強制歸位";
                }
            }
        }

        function stopWatering() {
            if(countdownTimer) clearInterval(countdownTimer);
            isOperating = false;
            document.getElementById('v-state').innerText = "關閉中";
            document.getElementById('v-state').style.color = "#ff4d4d";
            document.getElementById('v-source').innerText = "目前來源：自動監測模式";
            document.getElementById('timer-left').innerText = "0";
            document.getElementById('action-status').innerText = "系統待命";
            updateClock();
        }

        function addLog(data) {
            historyLogs.unshift(data);
            if (historyLogs.length > 50) historyLogs.pop();
            localStorage.setItem('garden_history', JSON.stringify(historyLogs));
            renderTable();
        }

        function renderTable() {
            const body = document.getElementById('log-body');
            const start = (currentPage - 1) * 10;
            const displayData = historyLogs.slice(start, start + 10);
            body.innerHTML = displayData.length === 0 ? '<tr><td colspan="4">暫無操作紀錄</td></tr>' : 
                displayData.map(log => `<tr><td>${log.time}</td><td>${log.user}</td><td>${log.info}</td><td><span class="badge bg-${log.type}">${log.status}</span></td></tr>`).join('');
            const maxPage = Math.ceil(historyLogs.length / 10) || 1;
            document.getElementById('page-info').innerText = `第 ${currentPage} / ${maxPage} 頁`;
        }

        function changePage(dir) {
            const maxPage = Math.ceil(historyLogs.length / 10) || 1;
            let target = currentPage + dir;
            if (target >= 1 && target <= maxPage) { currentPage = target; renderTable(); }
        }

        setInterval(updateClock, 1000);
    </script>
</body>
</html>
