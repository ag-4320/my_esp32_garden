<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動花園監測系統 - 控制中心</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* 原有樣式保留並優化 */
        .control-area { width: 100%; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .box { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 320px; }
        .time-text { font-size: 3.5rem; font-weight: 800; color: #007bff; text-shadow: 0 0 15px rgba(0, 123, 255, 0.4); font-family: 'Courier New', monospace; }
        
        /* 表格格專屬樣式 */
        .log-box { width: 100% !important; grid-column: span 2; min-height: 400px; } /* 讓表格占兩格寬度 */
        table { width: 95%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; color: #333; }
        tr:nth-child(even) { background-color: #fafafa; }
        .pagination { margin-top: 10px; display: flex; gap: 5px; }
        
        /* 輸入元件強化 */
        .input-group { margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        input[type="text"], input[type="number"] { padding: 8px; border: 2px solid #007bff; border-radius: 6px; text-align: center; font-weight: bold; }
        input[type="text"] { width: 120px; }
        input[type="number"] { width: 60px; }

        /* 標籤 */
        .tag { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; color: white; }
        .tag-manual { background: #4caf50; }
        .tag-auto { background: #2196f3; }
        .tag-stop { background: #f44336; }
    </style>
</head>
<body>
    
    <header>
        <h1>遠端控制設備</h1>
        <ul>
            <li><a href="首頁.html">首頁</a></li>
            <li><a href="動機.html">動機</a></li>
            <li><a href="製作名單.html">製作名單</a></li>
            <li><a href="控制中心.html">控制中心</a></li>
        </ul>
    </header> 

    <section class="標題">        
        <h2 id="status">雲端同步中...</h2>
    </section>

    <div class="container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="box">
            <span class="label">系統基準時間</span>
            <div class="control-area"><div id="clock" class="time-text">00:00:00</div></div>
            <div class="value-display"><span id="time-status">● 服務正常</span></div>
        </div>
    
        <div class="box">
            <span class="label">人為操作驗證</span>
            <div class="control-area">
                <div class="input-group">
                    <span>操作員:</span>
                    <input type="text" id="userName" placeholder="輸入名稱" maxlength="10">
                </div>
                <div class="input-group">
                    <span>時長:</span>
                    <input type="number" id="duration" value="10" min="1" max="60"> 秒
                </div>
                <div class="btn-group">
                    <button id="onBtn" onclick="ctl('on')" class="btn-on" style="background:#4caf50; color:white;">執行灑水</button>
                    <button id="offBtn" onclick="ctl('off')" class="btn-off" style="background:#f44336; color:white; margin-left:10px;">強制停止</button>
                </div>
            </div>
            <div class="value-display"><span id="action-status">請輸入姓名後執行</span></div>
        </div>

        <div class="box">
            <span class="label">水閥即時狀態</span>
            <div class="control-area">
                <div id="valve-state" style="font-size: 1.5rem; font-weight: bold;">等待同步</div>
                <div id="ctrl-source">來源：--</div>
                <div style="font-size: 2rem; color: #007bff; margin-top: 10px;"><span id="timer-left">0</span>s</div>
            </div>
        </div>

        <div class="box log-box">
            <span class="label">歷史操作日誌 (同步自雲端)</span>
            <table>
                <thead>
                    <tr>
                        <th>時間</th>
                        <th>操作者 / 模式</th>
                        <th>執行時長 / 加權</th>
                        <th>狀態</th>
                    </tr>
                </thead>
                <tbody id="log-body">
                    </tbody>
            </table>
            <div class="pagination" id="page-btns"></div>
        </div>
    </div>

    <script>
        const client = mqtt.connect('wss://f17a8164c5cb466da01ab155fdc041cf.s1.eu.hivemq.cloud:8884/mqtt', {
            username: 'ag-4320',
            password: 'Jason5238137'
        });

        let historyLogs = []; // 保存 50 筆
        let currentPage = 1;

        // 當收到 MQTT 訊息時 (包含別人發出的紀錄)
        client.on('message', (topic, message) => {
            if (topic === 'esp32/garden/logs') {
                const log = JSON.parse(message.toString());
                historyLogs.unshift(log); // 加入最前面
                if (historyLogs.length > 50) historyLogs.pop(); // 超過 50 筆刪除舊的
                renderTable();
            }
        });

        client.on('connect', () => {
            client.subscribe('esp32/garden/logs'); // 訂閱日誌頻道
            document.getElementById('status').innerText = "控制中心：全球同步已開啟";
        });

        function ctl(cmd) {
            const user = document.getElementById('userName').value.trim();
            const sec = document.getElementById('duration').value;

            if (!user && cmd === 'on') {
                alert("請先輸入使用者名稱！");
                return;
            }

            const now = new Date().toLocaleTimeString();
            let logData = {
                time: now,
                user: cmd === 'on' ? user : (user || "未知用戶"),
                duration: sec + "s",
                status: cmd === 'on' ? "強制灑水" : "強制停止",
                type: cmd === 'on' ? "manual" : "stop"
            };

            // 發送至 MQTT 伺服器，讓所有在線的人都能更新表格
            client.publish('esp32/control', cmd);
            client.publish('esp32/garden/logs', JSON.stringify(logData));
            
            // 處理本地 UI
            if(cmd === 'on') startCountdown(sec, user);
        }

        function startCountdown(sec, user) {
            let left = sec;
            document.getElementById('ctrl-source').innerText = "來源：" + user;
            const timer = setInterval(() => {
                left--;
                document.getElementById('timer-left').innerText = left;
                if (left <= 0) {
                    clearInterval(timer);
                    document.getElementById('ctrl-source').innerText = "來源：系統自動";
                }
            }, 1000);
        }

        function renderTable() {
            const start = (currentPage - 1) * 10;
            const pagedData = historyLogs.slice(start, start + 10);
            const tbody = document.getElementById('log-body');
            tbody.innerHTML = pagedData.map(log => `
                <tr>
                    <td>${log.time}</td>
                    <td>${log.user}</td>
                    <td>${log.duration}</td>
                    <td><span class="tag tag-${log.type}">${log.status}</span></td>
                </tr>
            `).join('');
            
            // 更新分頁按鈕 (簡單版)
            const pageDiv = document.getElementById('page-btns');
            pageDiv.innerHTML = `<button onclick="changePage(-1)">上一頁</button> <span>${currentPage}</span> <button onclick="changePage(1)">下一頁</button>`;
        }

        function changePage(dir) {
            currentPage += dir;
            if (currentPage < 1) currentPage = 1;
            renderTable();
        }

        // 定時更新時鐘
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('zh-TW', { hour12: false });
        }, 1000);
    </script>
</body>
</html>
