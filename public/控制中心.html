<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動花園監測系統 - 控制中心</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* 統一格子佈局，增加高度以容納大時間 */
        .control-area {
            width: 100%;
            height: 160px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px; /* 增加格子基礎高度 */
        }

        /* --- 時間顯示：加大、亮藍色、發光 --- */
        .time-text {
            font-size: 3.5rem; 
            font-weight: 800;
            color: #007bff;
            text-shadow: 0 0 15px rgba(0, 123, 255, 0.4);
            font-family: 'Courier New', Courier, monospace;
            margin: 10px 0;
        }

        /* --- 輸入區域排版分離 --- */
        #input-ui {
            margin-bottom: 20px; /* 推開下方的按鈕群 */
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="number"] {
            width: 70px;
            padding: 8px;
            border: 2px solid #007bff;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* 隱藏輸入框微調箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .btn-group {
            margin-top: 5px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            font-size: 1rem;
        }
        .btn-on { background-color: #4caf50; color: white; }
        .btn-off { background-color: #f44336; color: white; margin-left: 10px; }
        button:disabled { background-color: #ccc !important; cursor: not-allowed; opacity: 0.6; }

        .lock-msg {
            color: #f44336;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    
    <header>
        <h1>遠端控制設備</h1>
        <ul>
            <li><a href="首頁.html">首頁</a></li>
            <li><a href="動機.html">動機</a></li>
            <li><a href="訂閱.html">訂閱</a></li>
            <li><a href="製作名單.html">製作名單</a></li>
            <li><a href="控制中心.html">控制中心</a></li>
        </ul>
    </header> 

    <section class="標題">        
        <h2 id="status">正在建立雲端連線...</h2>
    </section>

    <div class="container">
        <div class="box">
            <span class="label">現在時間</span>
            <div class="control-area">
                <div id="clock" class="time-text">00:00:00</div>
            </div>
            <div class="value-display">
                <span id="time-status" style="font-size: 1.1rem; font-weight: bold;">檢查中...</span>
            </div>
        </div>
    
        <div class="box">
            <span class="label">水閥控制開關</span>
            <div class="control-area">
                <div id="input-ui">
                    <span style="font-weight: bold; color: #555;">預計開啟:</span>
                    <input type="number" id="duration" value="10" min="0" max="60" 
                           oninput="if(value>60)value=60;if(value<0)value=0"> 
                    <span style="font-weight: bold; color: #555;">秒</span>
                </div>
                
                <div class="btn-group">
                    <button id="onBtn" onclick="ctl('on')" class="btn-on">強制開啟</button>
                    <button id="offBtn" onclick="ctl('off')" class="btn-off">緊急關閉</button>
                </div>
                <div id="lockMsg" class="lock-msg" style="display:none;">⚠️ 非控制時段 (07-20)</div>
            </div>
            <div class="value-display">
                <span id="action-status">準備就緒</span>
            </div>
        </div>
    </div>

    <script>
        const client = mqtt.connect('wss://f17a8164c5cb466da01ab155fdc041cf.s1.eu.hivemq.cloud:8884/mqtt', {
            username: 'ag-4320',
            password: 'Jason5238137'
        });

        let isCoolingDown = false; 

        function updateClock() {
            const now = new Date();
            const h = now.getHours();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-TW', { hour12: false });

            const isAllowed = (h >= 7 && h < 20);
            const onBtn = document.getElementById('onBtn');
            const durationInput = document.getElementById('duration');
            const timeStatus = document.getElementById('time-status');
            const lockMsg = document.getElementById('lockMsg');

            if (isAllowed) {
                timeStatus.innerText = "● 接收指令中";
                timeStatus.style.color = "#2e7d32";
                lockMsg.style.display = "none";
                if (!isCoolingDown) onBtn.disabled = false;
                durationInput.disabled = false;
            } else {
                timeStatus.innerText = "○ 暫停接收指令";
                timeStatus.style.color = "#c62828";
                lockMsg.style.display = "block";
                onBtn.disabled = true;
                durationInput.disabled = true;
            }
        }

        function ctl(cmd) {
            if (isCoolingDown && cmd === 'on') return;

            if (client.connected) {
                client.publish('esp32/control', cmd);
                const actionStatus = document.getElementById('action-status');
                actionStatus.innerText = cmd === 'on' ? "指令已發送" : "已要求關閉";

                if (cmd === 'on') {
                    isCoolingDown = true;
                    document.getElementById('onBtn').disabled = true;
                    let countdown = 5;
                    const timer = setInterval(() => {
                        actionStatus.innerText = `冷卻中 (${countdown}s)`;
                        countdown--;
                        if (countdown < 0) {
                            clearInterval(timer);
                            isCoolingDown = false;
                            actionStatus.innerText = "準備就緒";
                            updateClock(); 
                        }
                    }, 1000);
                }
            } else {
                alert("尚未連線至 MQTT 伺服器");
            }
        }

        client.on('connect', () => {
            document.getElementById('status').innerText = "控制中心：雲端連線成功";
        });

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
