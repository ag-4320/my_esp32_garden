<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動花園監測系統 - 測試控制中心</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* --- 頁面質感優化 --- */
        body {
            /* 假設背景是深色，確保文字清晰 */
            color: #fff;
        }

        .time-text {
            font-size: 3.5rem; 
            font-weight: 800;
            color: #00d4ff; /* 換成更清爽的亮藍 */
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            font-family: 'Courier New', Courier, monospace;
            margin: 10px 0;
        }

        /* --- 表格與背景融合優化 (玻璃擬態風格) --- */
        .log-box { grid-column: span 2; width: 100%; justify-content: flex-start; padding-top: 50px; }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px; 
            /* 使用半透明深色，透出底層背景顏色 */
            background: rgba(12, 10, 125, 0.3); 
            backdrop-filter: blur(10px); /* 背景模糊，增加質感 */
            border-radius: 12px;
            overflow: hidden; 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        th { 
            background-color: rgba(12, 10, 125, 0.8); /* 稍微深一點的表頭 */
            color: #00d4ff; 
            padding: 15px;
            font-size: 1rem;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        td { 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            padding: 12px; 
            text-align: center; 
            color: #e0e0e0; /* 淺灰色字體，閱讀更舒服 */
        }

        /* 斑馬線：微調透明度差 */
        tbody tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.03);
        }

        tbody tr:hover {
            background-color: rgba(0, 212, 255, 0.1); /* 滑鼠經過時微亮 */
        }

        /* 按鈕與輸入框微調 */
        .box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }

        input[type="text"], input[type="number"] {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid #00d4ff;
            color: #fff;
        }

        .badge { padding: 4px 10px; border-radius: 6px; color: white; font-size: 0.8rem; font-weight: bold; }
        .bg-manual { background: #2e7d32; }
        .bg-stop { background: #c62828; }
        
        .page-ctrl { margin-top: 15px; display: flex; gap: 15px; align-items: center; justify-content: center; }
        button { transition: all 0.3s ease; }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    
    <header>
        <h1>遠端控制中心 (測試模式)</h1>
        <nav>
            <ul>
                <li><a href="首頁.html">首頁</a></li>
                <li><a href="動機.html">動機</a></li>
                <li><a href="訂閱.html">訂閱</a></li>
                <li><a href="製作名單.html">製作名單</a></li>
                <li><a href="控制中心.html">回主控制中心</a></li>
            </ul>
        </nav>
    </header> 

    <section class="標題">        
        <h2 id="status" class="status-tag offline">● 等待硬體連線...</h2>
    </section>

    <div class="container">
        <div class="box">
            <span class="label">系統時間</span>
            <div id="clock" class="time-text">00:00:00</div>
            <div class="value-display">
                <span id="time-status" style="font-weight: bold; color: #00d4ff;">● 測試模式：全天候開放</span>
            </div>
        </div>
    
        <div class="box">
            <span class="label">手動測試開關</span>
            <div id="input-ui">
                <div class="input-row">
                    <span>測試員:</span>
                    <input type="text" id="userName" placeholder="必填姓名" maxlength="10" style="width: 120px;">
                </div>
                <div class="input-row">
                    <span>噴灑秒數:</span>
                    <input type="number" id="duration" value="10" min="1" max="60" style="width: 80px;"> 秒
                </div>
            </div>
            <div class="btn-group">
                <button id="onBtn" onclick="ctl('on')" class="btn-on" disabled>開始測試</button>
                <button id="offBtn" onclick="ctl('off')" class="btn-off">緊急停止</button>
            </div>
            <div id="action-status" style="margin-top: 10px; font-size: 0.9rem; color: #aaa;">系統就緒</div>
        </div>

        <div class="box">
            <span class="label">水閥/LED 即時回傳</span>
            <div id="v-state" style="font-size: 2.5rem; font-weight: 900; color: #ff4d4d;">關閉中</div>
            <div id="v-source" style="font-size: 0.9rem; color: #aaa; margin-top: 5px;">目前來源：監測中</div>
            <div style="font-size: 3rem; color: #00d4ff; font-weight: 800; margin-top: 10px;"><span id="timer-left">0</span>s</div>
        </div>

        <div class="box log-box">
            <span class="label">歷史測試日誌</span>
            <table>
                <thead>
                    <tr>
                        <th>時間</th>
                        <th>執行者</th>
                        <th>詳情</th>
                        <th>狀態</th>
                    </tr>
                </thead>
                <tbody id="log-body"></tbody>
            </table>
            <div class="page-ctrl">
                <button onclick="changePage(-1)">上一頁</button>
                <span id="page-info">第 1 / 1 頁</span>
                <button onclick="changePage(1)">下一頁</button>
            </div>
        </div>
    </div>

    <script>
        /* MQTT 與邏輯部分保持不變，確保功能正常 */
        const client = mqtt.connect('wss://f17a8164c5cb466da01ab155fdc041cf.s1.eu.hivemq.cloud:8884/mqtt', {
            username: 'ag-4320', 
            password: 'Jason5238137'
        });

        let historyLogs = []; 
        let currentPage = 1;
        let lastDataTime = 0;
        let isTesting = false;
        let countdownTimer = null; 

        window.onload = () => {
            const saved = localStorage.getItem('garden_history');
            if(saved) historyLogs = JSON.parse(saved);
            renderTable();
        };

        client.on('connect', () => {
            client.subscribe('esp32/garden/all'); 
        });

        client.on('message', (topic, message) => {
            if (topic === 'esp32/garden/all') {
                lastDataTime = Date.now();
                try {
                    const data = JSON.parse(message.toString());
                    const vState = document.getElementById('v-state');
                    if (data.v === 1) {
                        vState.innerText = "開啟中";
                        vState.style.color = "#00ff88";
                    } else if (!isTesting) {
                        vState.innerText = "關閉中";
                        vState.style.color = "#ff4d4d";
                    }
                } catch(e) {}
            }
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-TW', { hour12: false });
            const isOnline = (Date.now() - lastDataTime < 15000); 
            const statusTag = document.getElementById('status');
            const onBtn = document.getElementById('onBtn');

            if (!isOnline) {
                statusTag.innerText = "○ 硬體離線 (等待連線)";
                statusTag.style.color = "#ff4d4d";
                onBtn.disabled = true;
            } else {
                statusTag.innerText = "● 硬體在線 (測試就緒)";
                statusTag.style.color = "#00ff88";
                if (!isTesting) onBtn.disabled = false;
            }
        }

        function ctl(cmd) {
            const user = document.getElementById('userName').value.trim();
            const sec = parseInt(document.getElementById('duration').value) || 10;
            if (cmd === 'on' && !user) { alert("請輸入測試者姓名！"); return; }
            if (client.connected) {
                const nowTime = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                const payload = (cmd === 'on') ? `on:${sec}` : "off";
                addLog({ time: nowTime, user: user || "系統", info: cmd === 'on' ? sec + " 秒" : "測試中斷", status: cmd === 'on' ? "手動測試" : "強制終止", type: cmd === 'on' ? "manual" : "stop" });
                client.publish('esp32/control', payload, { qos: 1 });
                if (cmd === 'on') {
                    isTesting = true;
                    document.getElementById('onBtn').disabled = true;
                    document.getElementById('v-state').innerText = "開啟中";
                    document.getElementById('v-state').style.color = "#00ff88";
                    let count = sec;
                    document.getElementById('timer-left').innerText = count;
                    if(countdownTimer) clearInterval(countdownTimer); 
                    countdownTimer = setInterval(() => {
                        count--;
                        document.getElementById('timer-left').innerText = Math.max(count, 0);
                        if (count <= 0) stopWatering();
                    }, 1000);
                } else {
                    stopWatering();
                }
            }
        }

        function stopWatering() {
            if(countdownTimer) clearInterval(countdownTimer);
            isTesting = false;
            document.getElementById('v-state').innerText = "關閉中";
            document.getElementById('v-state').style.color = "#ff4d4d";
            document.getElementById('timer-left').innerText = "0";
            updateClock();
        }

        function addLog(data) {
            historyLogs.unshift(data);
            if (historyLogs.length > 50) historyLogs.pop();
            localStorage.setItem('garden_history', JSON.stringify(historyLogs));
            renderTable();
        }

        function renderTable() {
            const body = document.getElementById('log-body');
            const start = (currentPage - 1) * 10;
            const displayData = historyLogs.slice(start, start + 10);
            body.innerHTML = displayData.length === 0 ? '<tr><td colspan="4">暫無紀錄</td></tr>' : 
                displayData.map(log => `<tr><td>${log.time}</td><td>${log.user}</td><td>${log.info}</td><td><span class="badge bg-${log.type}">${log.status}</span></td></tr>`).join('');
            const maxPage = Math.ceil(historyLogs.length / 10) || 1;
            document.getElementById('page-info').innerText = `第 ${currentPage} / ${maxPage} 頁`;
        }

        function changePage(dir) {
            const maxPage = Math.ceil(historyLogs.length / 10) || 1;
            let target = currentPage + dir;
            if (target >= 1 && target <= maxPage) { currentPage = target; renderTable(); }
        }

        setInterval(updateClock, 1000);
    </script>
</body>
</html>
